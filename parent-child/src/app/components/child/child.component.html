<div>

  <h2>Child Component</h2>
  <p>
    Message From Parent:
  </p>

  <div class="message-box">
    {{ receivedMessage }}
  </div>

  <br>

  <input
    type="text"
    [(ngModel)]="childMessage"
    placeholder="Reply to parent">

  <button (click)="sendToParent()">
    Reply To Parent
  </button>

</div>
