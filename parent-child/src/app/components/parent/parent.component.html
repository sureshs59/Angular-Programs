<div class="container">

  <h2>Parent Component</h2>

  <input
    type="text"
    [(ngModel)]="parentMessage"
    placeholder="Send message to child">

  <button (click)="sendToChild()">
    Send To Child
  </button>

  <hr>

  <app-child
    [messageFromParent]="parentMessage"
    (messageEvent)="receiveFromChild($event)">
  </app-child>

  <hr>

  <h3>Chat History</h3>
  <div *ngFor="let msg of chatHistory">
    {{ msg }}
  </div>
</div>
